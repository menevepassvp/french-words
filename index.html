<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法語單字練習</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="法語單字">
<meta name="theme-color" content="#1C2550">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF2F8; --surface: #FFFFFF; --ink: #1C2550; --muted: #5A6488; --line: #CBD3E6;
    --masc: #2F55B5; --masc-soft: #DCE5FA; --fem: #B23A64; --fem-soft: #F8DDE7;
    --known: #23825A; --known-soft: #D6F0E3; --unknown: #B86A0B; --unknown-soft: #FBE9CF;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #111733; --surface: #1A2246; --ink: #E8ECFA; --muted: #A3ACCF; --line: #2E3866;
      --masc: #8EADFF; --masc-soft: #233066; --fem: #F28FB2; --fem-soft: #4A2340;
      --known: #6FD3A2; --known-soft: #173D33; --unknown: #F2B25C; --unknown-soft: #45321A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #111733; --surface: #1A2246; --ink: #E8ECFA; --muted: #A3ACCF; --line: #2E3866;
    --masc: #8EADFF; --masc-soft: #233066; --fem: #F28FB2; --fem-soft: #4A2340;
    --known: #6FD3A2; --known-soft: #173D33; --unknown: #F2B25C; --unknown-soft: #45321A;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700;
    font-size: clamp(2.6rem, 9vw, 4.2rem); line-height: 1; margin: 0 0 .4rem; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); }
  .themes { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.25rem; }
  .themes button { font: inherit; font-size: .95rem; padding: .45rem 1.1rem; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .themes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0 0; font-size: .92rem; }
  .legend span { display: inline-flex; align-items: center; gap: .45rem; }
  .dot { width: .8rem; height: .8rem; border-radius: 50%; display: inline-block; }
  .dot.m { background: var(--masc); } .dot.f { background: var(--fem); }

  .howto { margin: 1.25rem 0 0; padding: .8rem 1rem; border-radius: 12px; background: var(--surface);
    border: 1.5px dashed var(--line); font-size: .95rem; }
  .howto b.k { color: var(--known); } .howto b.u { color: var(--unknown); }

  .stats { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1.25rem 0 .75rem; font-size: .92rem; }
  .stats span { padding: .25rem .75rem; border-radius: 999px; }
  .stats .u { background: var(--unknown-soft); color: var(--unknown); }
  .stats .n { background: var(--surface); color: var(--muted); }
  .stats .k { background: var(--known-soft); color: var(--known); }

  .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.25rem; }
  .controls button { font: inherit; font-size: .92rem; padding: .5rem .95rem; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  .row { position: relative; border-radius: 14px; overflow: hidden; background: var(--line); }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.25rem; font-weight: 700; opacity: 0; }
  .hint .l { color: var(--unknown); } .hint .r { color: var(--known); }
  .row.drag-right .hint { opacity: 1; background: var(--unknown-soft); }
  .row.drag-right .hint .r { visibility: hidden; }
  .row.drag-left .hint { opacity: 1; background: var(--known-soft); }
  .row.drag-left .hint .l { visibility: hidden; }

  .card { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .85rem;
    background: var(--surface); border-left: 6px solid var(--accent); border-radius: 4px 14px 14px 4px;
    padding: 1rem 1rem 1rem 1.15rem; touch-action: pan-y; user-select: none; cursor: grab;
    transition: transform .25s ease; }
  .card.dragging { transition: none; cursor: grabbing; }
  .m { --accent: var(--masc); --soft: var(--masc-soft); }
  .f { --accent: var(--fem); --soft: var(--fem-soft); }
  .row.known .card { opacity: .62; }
  .tag { display: inline-block; font-size: .78rem; padding: .05rem .55rem; border-radius: 999px;
    margin-left: .4rem; vertical-align: middle; font-family: "Noto Sans TC", sans-serif; font-style: normal; font-weight: 500; }
  .tag.known { background: var(--known-soft); color: var(--known); }
  .tag.unknown { background: var(--unknown-soft); color: var(--unknown); }

  .fr { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.85rem; font-weight: 700; line-height: 1.15; }
  .fr .art { color: var(--accent); font-weight: 500; font-style: italic; }
  .ipa { color: var(--muted); font-size: .95rem; margin-top: .15rem;
    font-family: "Charis SIL", "Doulos SIL", "Lucida Sans Unicode", "Noto Sans", sans-serif; }
  .zh { font-size: 1.05rem; font-weight: 500; margin-top: .3rem; }
  .zh small { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: .35rem; }
  .quiz .zh { filter: blur(7px); cursor: pointer; transition: filter .2s; }
  .quiz .zh.shown { filter: none; }
  .pic { width: 4.5rem; height: 4.5rem; align-self: start; border-radius: 12px; background: var(--soft); color: var(--accent); display: grid; place-items: center; }
  .pic svg { width: 78%; height: 78%; }
  @media (max-width: 420px) { .pic { width: 3.6rem; height: 3.6rem; } .card { gap: .6rem; } }
  .ex { display: flex; gap: .55rem; align-items: flex-start; margin-top: .65rem; padding-top: .6rem; border-top: 1px dashed var(--line); }
  .ex-fr { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.25rem; font-style: italic; font-weight: 500; line-height: 1.3; }
  .ex-zh { font-size: .9rem; color: var(--muted); }
  .say-ex { flex: none; width: 2rem; height: 2rem; margin-top: .1rem; border-radius: 50%; border: none; background: var(--soft); color: var(--accent); display: grid; place-items: center; cursor: pointer; }
  .say-ex svg { width: 1rem; height: 1rem; }
  .say-ex.speaking { background: var(--accent); color: var(--surface); }
  .quiz .ex-zh { filter: blur(6px); cursor: pointer; transition: filter .2s; }
  .quiz .ex-zh.shown { filter: none; }
  .gt { display: inline-block; margin-top: .35rem; font-size: .85rem; color: var(--accent); }

  .side { display: grid; gap: .4rem; justify-items: center; }
  .play { width: 3.1rem; height: 3.1rem; border-radius: 50%; border: none; background: var(--soft);
    color: var(--accent); cursor: pointer; display: grid; place-items: center; }
  .play svg { width: 1.35rem; height: 1.35rem; }
  .play.speaking { background: var(--accent); color: var(--surface); }
  .mark { display: flex; gap: .3rem; }
  .mark button { font: inherit; font-size: .75rem; border: 1px solid var(--line); background: transparent;
    color: var(--muted); border-radius: 999px; padding: .1rem .5rem; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--masc); outline-offset: 2px; }

  [hidden] { display: none !important; }
  .ex-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .92rem; margin: .5rem 0 1rem; }
  .ex-top button, .ex-actions button, .ex-next { font: inherit; font-size: .92rem; padding: .5rem 1rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .ex-next, .ex-again { background: var(--ink) !important; color: var(--paper) !important; border-color: var(--ink) !important; }
  .ex-q { display: grid; justify-items: center; text-align: center; gap: .3rem; background: var(--surface); border-radius: 16px; padding: 1.5rem 1rem; border-top: 6px solid var(--accent); }
  .ex-q .fr { font-size: 2.6rem; }
  .ex-ask { margin: 1.25rem 0 .6rem; font-weight: 500; }
  .ex-opts { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .opt { font: inherit; font-size: 1.1rem; padding: 1rem .5rem; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--known); background: var(--known-soft); color: var(--known); font-weight: 700; }
  .opt.wrong { border-color: var(--unknown); background: var(--unknown-soft); color: var(--unknown); }
  .verdict { font-weight: 700; font-size: 1.1rem; margin: 1.25rem 0 .6rem; }
  .verdict.ok { color: var(--known); } .verdict.no { color: var(--unknown); }
  .ex-card { display: flex; gap: .8rem; align-items: center; background: var(--surface); border-radius: 14px; padding: .9rem; margin-bottom: 1rem; }
  .ex-zh2 { color: var(--muted); font-size: .9rem; }
  .ex-score { text-align: center; background: var(--surface); border-radius: 16px; padding: 1.5rem 1rem; }
  .ex-score .big { font-family: "Cormorant Garamond", Georgia, serif; font-size: 3.5rem; font-weight: 700; line-height: 1; }
  .ex-wrong { list-style: none; padding: 0; margin: 0 0 1rem; display: grid; gap: .4rem; }
  .ex-wrong li { background: var(--surface); border-radius: 10px; padding: .6rem .9rem; }
  .ex-wrong span { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.25rem; font-weight: 700; }
  .ex-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
  .empty { text-align: center; color: var(--muted); padding: 2rem 1rem; background: var(--surface); border-radius: 14px; }
  .note { margin-top: 2rem; font-size: .9rem; color: var(--muted); }
  .warn { display: none; margin: 0 0 1rem; padding: .75rem 1rem; border-radius: 10px; background: var(--fem-soft); font-size: .92rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav class="themes" id="themes" aria-label="主題"></nav>
    <h1 id="title">Les meubles</h1>
    <p id="sub">法語家具單字 10 個｜點 ▶ 聽發音</p>
    <div class="legend">
      <span><i class="dot m"></i>陽性 le</span>
      <span><i class="dot f"></i>陰性 la</span>
    </div>
    <p class="howto">← 往左滑：<b class="k">熟悉了</b>（移到最下面）　往右滑 →：<b class="u">不熟悉</b>（排到熟悉的單字前面）</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls" role="group" aria-label="練習設定">
    <button id="onlyUnknown" aria-pressed="false">只看不熟悉</button>
    <button id="examBtn">考不熟悉的單字</button>
    <button id="examAllBtn">考全部單字</button>
    <button id="slow" aria-pressed="false">慢速發音</button>
    <button id="quiz" aria-pressed="false">遮住中文</button>
    <button id="all">依序播放</button>
    <button id="reset">清除標記</button>
  </div>

  <p class="warn" id="warn"></p>

  <ol id="list"></ol>
  <section id="exam" hidden></section>

  <p class="note">提示：以母音開頭的名詞（例如 l’armoire、l’assiette）冠詞會縮寫成 l’，要看卡片顏色記住它的陰陽性。標記會記在這台裝置的瀏覽器裡，下次打開還在。</p>
</div>

<script>
  const themes = {
   meubles: { title: "Les meubles", zh: "家具", words: [
    { id: "table", art: "la ", word: "table", ipa: "/la tabl/", zh: "桌子", g: "f", ex: "Le livre est sur la table.", exZh: "書在桌子上。" },
    { id: "chaise", art: "la ", word: "chaise", ipa: "/la ʃɛz/", zh: "椅子", g: "f", ex: "Il y a quatre chaises dans la cuisine.", exZh: "廚房裡有四張椅子。" },
    { id: "lit", art: "le ", word: "lit", ipa: "/lə li/", zh: "床", g: "m", tip: "t 不發音", ex: "Mon lit est très confortable.", exZh: "我的床很舒服。" },
    { id: "canape", art: "le ", word: "canapé", ipa: "/lə ka.na.pe/", zh: "沙發", g: "m", ex: "Nous regardons la télé sur le canapé.", exZh: "我們坐在沙發上看電視。" },
    { id: "fauteuil", art: "le ", word: "fauteuil", ipa: "/lə fo.tœj/", zh: "扶手椅", g: "m", ex: "Mon grand-père lit dans son fauteuil.", exZh: "我爺爺坐在他的扶手椅上看書。" },
    { id: "bureau", art: "le ", word: "bureau", ipa: "/lə by.ʁo/", zh: "書桌", g: "m", ex: "Je travaille à mon bureau.", exZh: "我在書桌前工作。" },
    { id: "armoire", art: "l’", word: "armoire", ipa: "/laʁ.mwaʁ/", zh: "衣櫃", g: "f", ex: "Mes vêtements sont dans l’armoire.", exZh: "我的衣服在衣櫃裡。" },
    { id: "etagere", art: "l’", word: "étagère", ipa: "/le.ta.ʒɛʁ/", zh: "書架、層架", g: "f", ex: "Les livres sont sur l’étagère.", exZh: "書放在書架上。" },
    { id: "commode", art: "la ", word: "commode", ipa: "/la kɔ.mɔd/", zh: "五斗櫃", g: "f", ex: "Je range mes chaussettes dans la commode.", exZh: "我把襪子收在五斗櫃裡。" },
    { id: "tabouret", art: "le ", word: "tabouret", ipa: "/lə ta.bu.ʁɛ/", zh: "凳子", g: "m", tip: "t 不發音", ex: "Le chat dort sur le tabouret.", exZh: "貓在凳子上睡覺。" }
   ] },
   vaisselle: { title: "La vaisselle", zh: "餐具", words: [
    { id: "assiette", art: "l’", word: "assiette", ipa: "/la.sjɛt/", zh: "盤子", g: "f", ex: "Je mets l’assiette sur la table.", exZh: "我把盤子放在桌上。" },
    { id: "bol", art: "le ", word: "bol", ipa: "/lə bɔl/", zh: "碗", g: "m", ex: "Je bois mon café dans un bol.", exZh: "我用碗喝咖啡。" },
    { id: "tasse", art: "la ", word: "tasse", ipa: "/la tas/", zh: "茶杯、咖啡杯", g: "f", ex: "Une tasse de thé, s’il vous plaît.", exZh: "請給我一杯茶。" },
    { id: "verre", art: "le ", word: "verre", ipa: "/lə vɛʁ/", zh: "玻璃杯", g: "m", ex: "Le verre est plein d’eau.", exZh: "杯子裝滿了水。" },
    { id: "fourchette", art: "la ", word: "fourchette", ipa: "/la fuʁ.ʃɛt/", zh: "叉子", g: "f", ex: "Je mange les pâtes avec une fourchette.", exZh: "我用叉子吃義大利麵。" },
    { id: "couteau", art: "le ", word: "couteau", ipa: "/lə ku.to/", zh: "刀子", g: "m", ex: "Ce couteau coupe bien.", exZh: "這把刀很好切。" },
    { id: "cuillere", art: "la ", word: "cuillère", ipa: "/la kɥi.jɛʁ/", zh: "湯匙", g: "f", ex: "Il mange la soupe avec une cuillère.", exZh: "他用湯匙喝湯。" },
    { id: "serviette", art: "la ", word: "serviette", ipa: "/la sɛʁ.vjɛt/", zh: "餐巾", g: "f", ex: "La serviette est à côté de l’assiette.", exZh: "餐巾在盤子旁邊。" },
    { id: "carafe", art: "la ", word: "carafe", ipa: "/la ka.ʁaf/", zh: "水壺、水瓶", g: "f", ex: "Une carafe d’eau, s’il vous plaît.", exZh: "請給我一壺水。" },
    { id: "plateau", art: "le ", word: "plateau", ipa: "/lə pla.to/", zh: "托盤", g: "m", ex: "Elle apporte le café sur un plateau.", exZh: "她用托盤端來咖啡。" }
   ] }
  };
  let theme = "meubles";
  try { const t = localStorage.getItem("fr-theme"); if (t && themes[t]) theme = t; } catch (e) {}
  let words = themes[theme].words;

  const svg = d => `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const pics = {
    table: svg('<rect x="6" y="18" width="52" height="6" rx="2"/><path d="M12 24v28M52 24v28M12 34h40"/>'),
    chaise: svg('<rect x="18" y="6" width="28" height="24" rx="3"/><path d="M24 12v12M32 12v12M40 12v12"/><rect x="14" y="30" width="36" height="6" rx="2"/><path d="M18 36v22M46 36v22"/>'),
    lit: svg('<path d="M8 12v44M56 30v26M8 46h48"/><rect x="8" y="36" width="48" height="10" rx="2"/><rect x="12" y="28" width="14" height="8" rx="3"/>'),
    canape: svg('<path d="M14 26v-8a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v8"/><rect x="6" y="26" width="10" height="20" rx="4"/><rect x="48" y="26" width="10" height="20" rx="4"/><rect x="16" y="34" width="32" height="12" rx="2"/><path d="M32 34v12M10 46v8M54 46v8"/>'),
    fauteuil: svg('<path d="M18 30V12a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v18"/><rect x="10" y="28" width="10" height="18" rx="4"/><rect x="44" y="28" width="10" height="18" rx="4"/><rect x="20" y="34" width="24" height="12" rx="2"/><path d="M14 46v10M50 46v10"/>'),
    bureau: svg('<rect x="4" y="20" width="56" height="5" rx="1.5"/><rect x="36" y="25" width="20" height="26" rx="1"/><path d="M36 38h20M44 31h4M44 44h4M10 25v31M38 51v5M54 51v5"/>'),
    armoire: svg('<rect x="14" y="4" width="36" height="50" rx="2"/><path d="M32 4v50M28 26v8M36 26v8M18 54v6M46 54v6"/>'),
    etagere: svg('<rect x="12" y="4" width="40" height="56" rx="1.5"/><path d="M12 22h40M12 41h40M12 60h40"/><path d="M17 22V10M22 22V8M27 22v-11M35 41V29M40 41l4-11M17 60V48M22 60V46"/>'),
    commode: svg('<rect x="8" y="12" width="48" height="40" rx="2"/><path d="M8 25.5h48M8 38.5h48M28 18.5h8M28 32h8M28 45.5h8M12 52v6M52 52v6"/>'),
    tabouret: svg('<rect x="14" y="14" width="36" height="7" rx="3.5"/><path d="M21 21l-6 36M43 21l6 36M18 42h28"/>'),
    assiette: svg('<circle cx="32" cy="32" r="25"/><circle cx="32" cy="32" r="15"/>'),
    bol: svg('<path d="M8 24h48a24 22 0 0 1-48 0z"/><path d="M24 52h16"/><path d="M26 16c-2-3 2-5 0-8M36 16c-2-3 2-5 0-8"/>'),
    tasse: svg('<path d="M12 20h32v16a12 12 0 0 1-12 12h-8a12 12 0 0 1-12-12z"/><path d="M44 24h4a6 6 0 0 1 0 12h-4"/><path d="M6 56h44"/>'),
    verre: svg('<path d="M16 8h32l-4 48H20z"/><path d="M18 26h28"/>'),
    fourchette: svg('<path d="M24 6v14M29 6v14M35 6v14M40 6v14M24 20a8 8 0 0 0 16 0M32 28v30"/>'),
    couteau: svg('<path d="M26 6c8 2 12 14 10 30H26z"/><rect x="26" y="36" width="10" height="22" rx="3"/>'),
    cuillere: svg('<ellipse cx="32" cy="17" rx="9" ry="12"/><path d="M32 29v29"/>'),
    serviette: svg('<rect x="10" y="14" width="44" height="36" rx="2"/><path d="M10 14l22 18 22-18"/>'),
    carafe: svg('<path d="M24 6h16M26 6v12c-10 6-14 14-14 22 0 10 6 16 20 16s20-6 20-16c0-8-4-16-14-22V6"/><path d="M14 38h36"/>'),
    plateau: svg('<rect x="8" y="34" width="48" height="8" rx="3"/><path d="M3 32v12M61 32v12"/><path d="M20 34v-8a6 6 0 0 1 12 0v8M40 34V22h8v12"/>')
  };

  const KEY = "fr-furniture-status";
  let status = {};
  try { status = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { status = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(status)); } catch (e) {} };

  const list = document.getElementById("list");
  let onlyUnknown = false, quiz = false, slow = false;
  const icon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  const rank = { undefined: 0, unknown: 1, known: 2 };

  function visibleWords() {
    let arr = words.map((w, i) => ({ ...w, i }));
    if (onlyUnknown) arr = arr.filter(w => status[w.id] === "unknown");
    const order = Object.keys(status);
    return arr.sort((a, b) => (rank[status[a.id]] - rank[status[b.id]]) ||
      (status[a.id] === "unknown" ? order.indexOf(a.id) - order.indexOf(b.id) : a.i - b.i));
  }

  function render() {
    const arr = visibleWords();
    list.classList.toggle("quiz", quiz);
    list.innerHTML = "";
    if (!arr.length) {
      list.innerHTML = '<li class="empty">目前沒有不熟悉的單字。關掉「只看不熟悉」可以看到全部單字。</li>';
    }
    arr.forEach(w => {
      const s = status[w.id];
      const text = (w.art + w.word).replace("’", "'");
      const li = document.createElement("li");
      li.className = `row ${w.g} ${s || ""}`;
      li.dataset.id = w.id;
      li.innerHTML = `
        <div class="hint" aria-hidden="true"><span class="l">不熟悉</span><span class="r">熟悉了</span></div>
        <div class="card">
          <div class="pic" aria-hidden="true">${pics[w.id]}</div>
          <div>
            <div class="fr" lang="fr"><span class="art">${w.art}</span>${w.word}${
              s === "known" ? '<span class="tag known">熟悉</span>' : s === "unknown" ? '<span class="tag unknown">不熟悉</span>' : ""}</div>
            <div class="ipa">${w.ipa}</div>
            <div class="zh">${w.zh}${w.tip ? `<small>${w.tip}</small>` : ""}</div>
            <div class="ex">
              <button class="say-ex" data-id="${w.id}" aria-label="播放例句">${icon}</button>
              <div><div class="ex-fr" lang="fr">${w.ex}</div><div class="ex-zh">${w.exZh}</div></div>
            </div>
            <a class="gt" href="https://translate.google.com/?sl=fr&tl=zh-TW&op=translate&text=${encodeURIComponent(text)}" target="_blank" rel="noopener">沒聲音？到 Google 翻譯聽</a>
          </div>
          <div class="side">
            <button class="play" aria-label="播放 ${w.art}${w.word} 的發音" data-id="${w.id}">${icon}</button>
            <div class="mark">
              <button data-set="known" aria-label="標記為熟悉">熟悉</button>
              <button data-set="unknown" aria-label="標記為不熟悉">不熟</button>
            </div>
          </div>
        </div>`;
      list.appendChild(li);
      attachSwipe(li);
    });
    const c = { unknown: 0, known: 0 };
    words.forEach(w => { if (status[w.id]) c[status[w.id]]++; });
    document.getElementById("stats").innerHTML =
      `<span class="u">不熟悉 ${c.unknown}</span><span class="n">未標記 ${words.length - c.unknown - c.known}</span><span class="k">熟悉 ${c.known}</span>`;
  }

  function setStatus(id, s) {
    if (status[id] === s) delete status[id]; else { delete status[id]; status[id] = s; }
    save(); render();
  }

  function attachSwipe(row) {
    const card = row.querySelector(".card");
    let startX = 0, startY = 0, dx = 0, active = false, horizontal = null;
    card.addEventListener("pointerdown", e => {
      if (e.target.closest("button, a")) return;
      active = true; horizontal = null; dx = 0; startX = e.clientX; startY = e.clientY;
    });
    card.addEventListener("pointermove", e => {
      if (!active) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if (horizontal === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
        horizontal = Math.abs(mx) > Math.abs(my);
        if (horizontal) { card.setPointerCapture(e.pointerId); card.classList.add("dragging"); }
        else { active = false; return; }
      }
      if (!horizontal) return;
      dx = mx;
      card.style.transform = `translateX(${dx}px)`;
      row.classList.toggle("drag-left", dx < -10);
      row.classList.toggle("drag-right", dx > 10);
    });
    const end = () => {
      if (!active) return;
      active = false;
      card.classList.remove("dragging");
      const limit = Math.min(110, card.offsetWidth * 0.28);
      if (horizontal && Math.abs(dx) > limit) {
        card.style.transform = `translateX(${dx < 0 ? "-110%" : "110%"})`;
        const s = dx < 0 ? "known" : "unknown";
        setTimeout(() => { delete status[row.dataset.id]; status[row.dataset.id] = s; save(); render(); }, 200);
      } else {
        card.style.transform = "";
        row.classList.remove("drag-left", "drag-right");
      }
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }

  // speech
  const synth = window.speechSynthesis;
  const warn = document.getElementById("warn");
  let frVoice = null;
  function pickVoice() {
    if (!synth) return;
    const v = synth.getVoices();
    frVoice = v.find(x => x.lang === "fr-FR") || v.find(x => x.lang && x.lang.startsWith("fr")) || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  function fail() {
    warn.textContent = "語音沒有播出來。請確認手機不是靜音模式、音量已調高；如果是在 Claude App 裡開啟，請改用 Safari 或 Chrome。也可以點單字下方的連結到 Google 翻譯聽。";
    warn.style.display = "block";
  }
  function speak(id, ex) {
    return new Promise(resolve => {
      if (!synth) { fail(); return resolve(); }
      const w = words.find(x => x.id === id);
      const btn = list.querySelector(`${ex ? ".say-ex" : ".play"}[data-id="${id}"]`);
      const u = new SpeechSynthesisUtterance((ex ? w.ex : w.art + w.word).replace(/’/g, "'"));
      u.lang = "fr-FR"; if (frVoice) u.voice = frVoice; u.rate = slow ? 0.6 : 0.9;
      let started = false;
      u.onstart = () => { started = true; btn && btn.classList.add("speaking"); };
      u.onend = () => { btn && btn.classList.remove("speaking"); resolve(); };
      u.onerror = () => { btn && btn.classList.remove("speaking"); fail(); resolve(); };
      synth.resume(); synth.speak(u);
      setTimeout(() => { if (!started) { synth.cancel(); fail(); resolve(); } }, 2500);
    });
  }

  list.addEventListener("click", e => {
    const sayEx = e.target.closest(".say-ex");
    if (sayEx) { synth && synth.cancel(); speak(sayEx.dataset.id, true); return; }
    const play = e.target.closest(".play");
    if (play) { synth && synth.cancel(); speak(play.dataset.id); return; }
    const set = e.target.closest("[data-set]");
    if (set) { setStatus(set.closest(".row").dataset.id, set.dataset.set); return; }
    const zh = e.target.closest(".zh, .ex-zh");
    if (zh && quiz) zh.classList.toggle("shown");
  });

  const toggle = (id, fn) => document.getElementById(id).addEventListener("click", e => {
    const on = fn(); e.currentTarget.setAttribute("aria-pressed", on);
  });
  toggle("onlyUnknown", () => { onlyUnknown = !onlyUnknown; render(); return onlyUnknown; });
  toggle("slow", () => (slow = !slow));
  toggle("quiz", () => { quiz = !quiz; render(); return quiz; });
  const resetBtn = document.getElementById("reset");
  let resetArmed = null;
  resetBtn.addEventListener("click", () => {
    if (!resetArmed) {
      resetBtn.textContent = "再點一次確認清除";
      resetBtn.setAttribute("aria-pressed", "true");
      resetArmed = setTimeout(() => { resetArmed = null; resetBtn.textContent = "清除標記"; resetBtn.setAttribute("aria-pressed", "false"); }, 3000);
      return;
    }
    clearTimeout(resetArmed); resetArmed = null;
    words.forEach(w => delete status[w.id]);
    save(); render();
    resetBtn.textContent = "已清除";
    resetBtn.setAttribute("aria-pressed", "false");
    setTimeout(() => { resetBtn.textContent = "清除標記"; }, 1500);
  });
  document.getElementById("all").addEventListener("click", async () => {
    if (!synth) { fail(); return; }
    synth.cancel();
    for (const w of visibleWords()) { await speak(w.id); await new Promise(r => setTimeout(r, 600)); }
  });

  // exam
  const exam = document.getElementById("exam");
  const mainEls = [document.getElementById("stats"), list, document.querySelector(".controls"), document.querySelector(".note")];
  let exm = null;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function showMain(on) { mainEls.forEach(el => el.hidden = !on); exam.hidden = on; window.scrollTo(0, 0); }

  function startExam(mode) {
    const pool = mode === "all" ? [...words] : words.filter(w => status[w.id] === "unknown");
    if (!pool.length) { warn.textContent = "目前這個主題沒有不熟悉的單字。先把不熟悉的單字往右滑標記，再來考試。"; warn.style.display = "block"; warn.scrollIntoView({ block: "center" }); return; }
    warn.style.display = "none";
    exm = { mode, qs: shuffle([...pool]), n: 0, right: [], wrong: [] };
    showMain(false); question();
  }

  function question() {
    const w = exm.qs[exm.n];
    const opts = shuffle([w, ...shuffle(words.filter(x => x.id !== w.id)).slice(0, 3)]);
    exam.innerHTML = `
      <div class="ex-top"><span>第 ${exm.n + 1} / ${exm.qs.length} 題</span><button class="ex-quit">結束考試</button></div>
      <div class="ex-q ${w.g}">
        <button class="play" data-id="${w.id}" aria-label="播放發音">${icon}</button>
        <div class="fr" lang="fr"><span class="art">${w.art}</span>${w.word}</div>
        <div class="ipa">${w.ipa}</div>
      </div>
      <p class="ex-ask">這個單字的中文是？</p>
      <div class="ex-opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${o.zh}</button>`).join("")}</div>
      <div class="ex-result" aria-live="polite"></div>`;
  }

  function answer(id) {
    const w = exm.qs[exm.n];
    const ok = id === w.id;
    (ok ? exm.right : exm.wrong).push(w);
    exam.querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      if (b.dataset.id === w.id) b.classList.add("right");
      else if (b.dataset.id === id) b.classList.add("wrong");
    });
    const last = exm.n === exm.qs.length - 1;
    exam.querySelector(".ex-result").innerHTML = `
      <p class="verdict ${ok ? "ok" : "no"}">${ok ? "答對了！" : `答錯了，正確答案是「${w.zh}」`}</p>
      <div class="ex-card ${w.g}"><div class="pic">${pics[w.id]}</div><div><div class="ex-fr" lang="fr">${w.ex}</div><div class="ex-zh2">${w.exZh}</div></div></div>
      <button class="ex-next">${last ? "看成績" : "下一題"}</button>`;
    synth && synth.cancel();
    speak(w.id);
  }

  function results() {
    const r = exm.right.length, t = exm.qs.length;
    exam.innerHTML = `
      <div class="ex-score"><div class="big">${r} / ${t}</div><p>${r === t ? "全部答對，太棒了！" : "再複習一下答錯的單字吧。"}</p></div>
      ${exm.wrong.length ? `<p class="ex-ask">答錯的單字</p><ul class="ex-wrong">${exm.wrong.map(w => `<li><span lang="fr">${w.art}${w.word}</span>　${w.zh}</li>`).join("")}</ul>` : ""}
      <div class="ex-actions">
        ${r ? `<button class="ex-mark">把答對的 ${r} 個標為熟悉</button>` : ""}
        ${exm.wrong.length ? `<button class="ex-mark-wrong">把答錯的 ${exm.wrong.length} 個標為不熟悉</button>` : ""}
        <button class="ex-again">再考一次</button>
        <button class="ex-quit">回到單字</button>
      </div>`;
  }

  exam.addEventListener("click", e => {
    const t = e.target;
    const play = t.closest(".play");
    if (play) { synth && synth.cancel(); speak(play.dataset.id); return; }
    const o = t.closest(".opt");
    if (o && !o.disabled) { answer(o.dataset.id); return; }
    if (t.closest(".ex-next")) { exm.n++; exm.n < exm.qs.length ? question() : results(); window.scrollTo(0, 0); return; }
    if (t.closest(".ex-again")) { startExam(exm.mode); return; }
    const markWrong = t.closest(".ex-mark-wrong");
    if (markWrong) { exm.wrong.forEach(w => { delete status[w.id]; status[w.id] = "unknown"; }); save(); render(); markWrong.disabled = true; markWrong.textContent = "已標為不熟悉"; return; }
    const mark = t.closest(".ex-mark");
    if (mark) { exm.right.forEach(w => status[w.id] = "known"); save(); render(); mark.disabled = true; mark.textContent = "已標為熟悉"; return; }
    if (t.closest(".ex-quit")) { synth && synth.cancel(); showMain(true); render(); }
  });
  document.getElementById("examBtn").addEventListener("click", () => startExam("unknown"));
  document.getElementById("examAllBtn").addEventListener("click", () => startExam("all"));

  // themes
  const themesNav = document.getElementById("themes");
  mainEls.push(themesNav);
  function renderThemes() {
    const t = themes[theme];
    themesNav.innerHTML = Object.entries(themes).map(([k, v]) =>
      `<button data-theme="${k}" aria-pressed="${k === theme}">${v.zh}</button>`).join("");
    document.getElementById("title").textContent = t.title;
    document.getElementById("sub").textContent = `法語${t.zh}單字 ${t.words.length} 個｜點 ▶ 聽發音`;
    document.title = `法語${t.zh}單字`;
  }
  themesNav.addEventListener("click", e => {
    const b = e.target.closest("[data-theme]");
    if (!b || b.dataset.theme === theme) return;
    synth && synth.cancel();
    theme = b.dataset.theme;
    words = themes[theme].words;
    try { localStorage.setItem("fr-theme", theme); } catch (err) {}
    renderThemes(); render();
  });
  renderThemes();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  render();
</script>
</body>
</html>
